<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="recentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E95420"/>
      <stop offset="100%" stop-color="#77216F"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Back Card -->
  <rect x="16" y="6" width="24" height="28" rx="5" fill="#5E2750" stroke="rgba(255,255,255,0.4)" stroke-width="1.2" opacity="0.9" />
  <!-- Front Card -->
  <rect x="8" y="14" width="24" height="28" rx="5" fill="url(#recentGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#cardShadow)"/>
  <!-- App bar line -->
  <rect x="12" y="18" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.95"/>
  <!-- App preview rect -->
  <rect x="12" y="24" width="16" height="13" rx="2.5" fill="#ffffff" opacity="0.35"/>
</svg>
